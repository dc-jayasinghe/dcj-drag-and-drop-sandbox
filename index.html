
<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta version="v1.0.2">
<title>Smart Math Activity</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background-size:cover;
  background-position:center;
  overflow:hidden;
}

/* TOP BAR */
#topBar{
  background:#222;
  color:white;
  padding:8px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* TITLE */
#titleBox{
  text-align:center;
  background:rgba(255,255,255,0.9);
  padding:10px;
  font-size:24px;
}

/* INSTRUCTIONS */
#instructions{
  margin:10px;
  padding:10px 20px;
  background:rgba(0,0,0,0.6);
  color:white;
  font-size:18px;
  border-radius:10px;
}

/* TEACHER PANEL */
#teacherPanel{
  position:fixed;
  right:10px;
  bottom:10px;
  background:rgba(255,255,255,0.95);
  padding:10px;
  border-radius:10px;
  display:none;
}

button{
  font-size:16px;
  padding:6px 10px;
  margin:3px;
  cursor:pointer;
}

/* ACTIVITY */
.page{ display:none; }
.page.active{ display:block; }

.draggable{
  position:absolute;
  width:80px;
  cursor:grab;
  touch-action:none;
  z-index: 10;
}

.drop-zone{
  position:absolute;
  width:110px;
  height:110px;
  border:3px dashed #444;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  z-index: 1;
}

.correct{ background:#c9f7c9; border-color:green; }
.wrong{ background:#ffd6d6; border-color:red; }
</style>
</head>

<body>

<!-- TOP BAR -->
<div id="topBar">
  <div>⭐ Score: <span id="score">0</span></div>
  <div>
    <button onclick="toggleTeacher()">👩‍🏫</button>
    <button onclick="toggleFull()">📺 Full</button>
    <button onclick="nextPage()">Next ➜</button>
  </div>
</div>

<div id="titleBox">🔢 අංක හා 📐 හැඩ ගැළපීම</div>

<div id="instructions"></div>

<!-- PAGE 1 -->
<div class="page active" id="page1">
  

  <div class="drop-zone" data-zone="1" style="left:300px; top:200px;">1</div>
  <div class="drop-zone" data-zone="2" style="left:430px; top:200px;">2</div>
  <div class="drop-zone" data-zone="3" style="left:560px; top:200px;">3</div>

<img src="222.png" class="draggable" data-answer="1" style="left:40px; top:160px;">
  <img src="444.png" class="draggable" data-answer="2" style="left:40px; top:260px;">
  <img src="555.png" class="draggable" data-answer="3" style="left:40px; top:360px;">
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  
  <div class="drop-zone" data-zone="circle" style="left:320px; top:300px;">⭕</div>
  <div class="drop-zone" data-zone="square" style="left:470px; top:300px;">⬜</div>
  <div class="drop-zone" data-zone="triangle" style="left:620px; top:300px;">🔺</div>

<img src="23.png" class="draggable" data-answer="circle" style="left:40px; top:200px;">
  <img src="24.png" class="draggable" data-answer="square" style="left:40px; top:320px;">
  <img src="25.png" class="draggable" data-answer="triangle" style="left:40px; top:440px;">

</div>

<!-- TEACHER PANEL -->
<div id="teacherPanel">
  <button onclick="resetPage()">🔄 Reset</button>
  <button onclick="speak()">🔊 Repeat Voice</button>
  <button onclick="toggleInstructions()">👁️ Instructions</button>
</div>

<script>
let score=0, pageIndex=0;
const pages=document.querySelectorAll(".page");
const instructions=document.getElementById("instructions");

/* BACKGROUND + VOICE TEXT */
const pageData=[
 {bg:"bg-numbers.jpg", text:"වම් පැත්තේ ඇති අංක drag කර නිවැරදි box එකට දමන්න."},
 {bg:"bg-shapes.jpg", text:"හැඩයන් drag කර ඒවාට ගැළපෙන ස්ථානයට දමන්න."}
];

function loadPage(){
 document.body.style.backgroundImage=`url(${pageData[pageIndex].bg})`;
 instructions.textContent=pageData[pageIndex].text;
 speak();
}
loadPage();

/* VOICE */
function speak(){
 speechSynthesis.cancel();
 const msg=new SpeechSynthesisUtterance(instructions.textContent);
 msg.lang="si-LK";
 speechSynthesis.speak(msg);
}

/* FULL SCREEN */
function toggleFull(){
 if(!document.fullscreenElement){
   document.documentElement.requestFullscreen();
 } else {
   document.exitFullscreen();
 }
}

/* TEACHER PANEL */
function toggleTeacher(){
 const p=document.getElementById("teacherPanel");
 p.style.display=p.style.display==="block"?"none":"block";
}

function toggleInstructions(){
 instructions.style.display=
 instructions.style.display==="none"?"block":"none";
}

/* NEXT PAGE */
function nextPage(){
 pages[pageIndex].classList.remove("active");
 pageIndex=(pageIndex+1)%pages.length;
 pages[pageIndex].classList.add("active");
 loadPage();
}

/* RESET */
function resetPage(){
 pages[pageIndex].querySelectorAll(".draggable").forEach(img=>{
   img.style.pointerEvents="auto";
 });
 pages[pageIndex].querySelectorAll(".drop-zone").forEach(z=>{
   z.classList.remove("correct","wrong");
 });
}

/* DRAG SYSTEM */
let active=null, ox=0, oy=0;
document.querySelectorAll(".draggable").forEach(img=>{
 img.addEventListener("mousedown",start);
 img.addEventListener("touchstart",start,{passive:false});
 function start(e){
  e.preventDefault();
  active=img;
  const p=e.touches?e.touches[0]:e;
  ox=p.clientX-img.offsetLeft;
  oy=p.clientY-img.offsetTop;
 }
});
document.addEventListener("mousemove",move);
document.addEventListener("touchmove",move,{passive:false});
function move(e){
 if(!active)return;
 const p=e.touches?e.touches[0]:e;
 active.style.left=(p.clientX-ox)+"px";
 active.style.top=(p.clientY-oy)+"px";
}
document.addEventListener("mouseup",end);
document.addEventListener("touchend",end);
function end(){
 if(!active)return;
 checkDrop(active);
 active=null;
}
function checkDrop(img){
 const ir=img.getBoundingClientRect();
 pages[pageIndex].querySelectorAll(".drop-zone").forEach(z=>{
  const zr=z.getBoundingClientRect();
  if(ir.left<zr.right&&ir.right>zr.left&&ir.top<zr.bottom&&ir.bottom>zr.top){
   if(img.dataset.answer===z.dataset.zone){
    z.classList.add("correct");
    score++;
    document.getElementById("score").textContent=score;
    img.style.pointerEvents="none";
   }else{
    z.classList.add("wrong");
    setTimeout(()=>z.classList.remove("wrong"),600);
   }
  }
 });
}

function start(e){
  e.preventDefault();
  active = img;
  const p = e.touches ? e.touches[0] : e;
  ox = p.clientX - img.offsetLeft;
  oy = p.clientY - img.offsetTop;

  img.style.zIndex = 9999;   // 🔴 front bring
}

function end(){
  if(!active) return;
  checkDrop(active);
  active.style.zIndex = 10; // normal level
  active = null;
}
</script>

</body>
</html>
